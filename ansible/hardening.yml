---
- name: Harden production Linux server
  hosts: linux_servers
  become: true

  tasks:

    - name: Update installed packages
      ansible.builtin.dnf:
        name: "*"
        state: latest

    - name: Install administration packages
      ansible.builtin.dnf:
        name:
          - vim
        state: present

    - name: Disable SSH root login
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PermitRootLogin'
        line: 'PermitRootLogin no'
        validate: '/usr/sbin/sshd -t -f %s'
      notify: Restart SSH

    - name: Disable SSH password authentication
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PasswordAuthentication'
        line: 'PasswordAuthentication no'
        validate: '/usr/sbin/sshd -t -f %s'
      notify: Restart SSH

    - name: Disable empty SSH passwords
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PermitEmptyPasswords'
        line: 'PermitEmptyPasswords no'
        validate: '/usr/sbin/sshd -t -f %s'
      notify: Restart SSH

    - name: Create dedicated administration user
      ansible.builtin.user:
        name: securityadmin
        groups: wheel
        append: true
        create_home: true
        shell: /bin/bash
        password_lock: true

    - name: Configure sudo access for administration user
      ansible.builtin.copy:
        dest: /etc/sudoers.d/securityadmin
        content: "securityadmin ALL=(ALL) ALL\n"
        owner: root
        group: root
        mode: '0440'
        validate: '/usr/sbin/visudo -cf %s'

    - name: Secure SSH configuration permissions
      ansible.builtin.file:
        path: /etc/ssh/sshd_config
        owner: root
        group: root
        mode: '0600'

  handlers:

    - name: Restart SSH
      ansible.builtin.service:
        name: sshd
        state: restarted